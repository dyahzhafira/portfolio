services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dyah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  backend-go:
    build:
      context: ../backend-go
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dyah:${POSTGRES_PASSWORD}@db:5432/portfolio?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - backend-go
    ports:
    - "80:80"

volumes:
  pgdata: